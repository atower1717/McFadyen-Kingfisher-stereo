<style>
  html,body{margin:0;padding:0;background:#000;overflow:hidden;height:100%;font-family:'Georgia',serif;}
  #stage{position:fixed;top:0;left:0;width:100vw;height:100vh;width:100dvw;height:100dvh;
    display:flex;align-items:center;justify-content:center;overflow:hidden;}
  #imgwrap{position:relative;width:var(--fitw,70vmin);height:var(--fith,94vmin);
    max-width:100vw;max-height:100dvh;}

    background:#000;z-index:10;cursor:pointer;transition:opacity 2.2s ease;}
  #enter .eyebrow{color:#7d766a;font-weight:400;letter-spacing:.30em;
    font-size:clamp(16px,2.7vw,38px);text-transform:uppercase;margin:0 0 .55em;}
  #enter .eyebrow .sec{text-transform:none;letter-spacing:.05em;font-size:.80em;}
  #enter h1{color:#e8e2d4;font-weight:400;letter-spacing:.20em;
    font-size:clamp(30px,4.9vw,76px);text-transform:uppercase;margin:0 0 .42em;line-height:1;
    text-align:center;}
  #enter .tagline{color:#8a8474;font-style:italic;letter-spacing:.03em;
    font-size:clamp(16px,2.4vw,34px);margin:0 0 2.0em;}
  #enter .box{border:1px solid #3a4654;padding:.85em 2.1em;color:#aeb9c5;letter-spacing:.30em;
    text-transform:uppercase;font-size:clamp(11px,1.5vw,14px);
    opacity:0;animation:fade 2.6s ease 1.0s forwards;transition:background .6s,color .6s,border-color .6s;}
  #enter .box:hover{background:#1a232e;color:#e6edf4;border-color:#5a6a7c;}
  @keyframes fade{to{opacity:1}}
  #enter.gone{opacity:0;pointer-events:none;}
  #again{position:absolute;left:50%;top:88%;transform:translate(-50%,-50%);z-index:11;
    border:3px solid #b89b6a;padding:1.5em 2.4em 1.7em;cursor:pointer;
    background:rgba(8,9,7,.62);text-align:center;max-width:min(80vw,560px);
    opacity:0;transition:opacity 1.4s ease;}
  #again:hover{background:rgba(0,0,0,.72);border-color:#cdb384;}
  #again .again-h{color:#e8e2d4;font-weight:400;letter-spacing:.32em;text-transform:uppercase;
    font-size:clamp(15px,2.0vw,22px);margin:0 0 .9em;}
  #again .again-body{color:#c7c3b4;font-weight:400;letter-spacing:.01em;line-height:1.5;
    font-size:clamp(14px,1.7vw,20px);}
  #again.show{opacity:1;}
  #enter .stv{color:#8a96a3;letter-spacing:.30em;text-transform:uppercase;font-size:clamp(11px,1.5vw,15px);margin:-1.2em 0 2.2em;}
  #enter .dl{margin-top:1.4em;border:1px solid #2c3540;padding:.55em 1.6em;color:#7f8a96;letter-spacing:.22em;
    text-transform:uppercase;font-size:clamp(10px,1.3vw,13px);cursor:pointer;}
  #turn{position:fixed;inset:0;display:none;align-items:center;justify-content:center;color:#8a8474;
    background:#000;z-index:20;letter-spacing:.12em;font-size:18px;text-align:center;padding:0 2em;}
  @media (orientation:portrait){ body.running #turn{display:flex;} }
  #adjbtn{position:fixed;left:calc(env(safe-area-inset-left) + 6px);top:calc(env(safe-area-inset-top) + 4px);z-index:12;
    color:#4a525c;font:12px -apple-system,Helvetica,sans-serif;letter-spacing:.15em;display:none;cursor:pointer;padding:10px 12px;}
  body.running #adjbtn{display:block;}
  #panel{position:fixed;left:calc(env(safe-area-inset-left) + 10px);top:calc(env(safe-area-inset-top) + 44px);z-index:13;
    display:none;background:rgba(8,10,12,.92);border:1px solid #2c3540;padding:10px 14px;color:#a9b3bd;
    font:12px/1.9 -apple-system,Helvetica,sans-serif;}
  #panel input{width:170px;vertical-align:middle;}
  #panel span.v{display:inline-block;width:52px;text-align:right;color:#e6edf4;}
  #pclose{display:block;margin-top:8px;text-align:center;border:1px solid #3a4654;color:#e6edf4;padding:6px 0;letter-spacing:.2em;cursor:pointer;}
</style>
</head>

<script>
"use strict";
var DURATION = 100.0;
var IMG_W = 1528, IMG_H = 2052;

var canvas = document.getElementById('c');
var gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');

var vsrc = [
"attribute vec2 p;",
"varying vec2 uv;",
"void main(){ uv = vec2(p.x*0.5+0.5, 0.5-p.y*0.5); gl_Position = vec4(p,0.0,1.0); }"
].join("\n");

// ---------------------------------------------------------------------------
// McFADYEN'S KINGFISHER - the held instant.
//
// THE MIRROR IS THE PIECE. All air-driven motion is produced by ONE function,
// airMotion(q), evaluated in bird-space. The bird is that function at p. The
// reflection is the SAME function evaluated at the mirrored point, with the
// vertical component flipped. Every feather, every wing flex, every crown
// ripple and every wind front therefore appears below at the same instant it
// appears above - not something similar, the same event inverted.
//
// The mirror map was measured off the plate, not assumed: axis y = 0.616,
// vertical scale 1.050 (the reflection stands 5 percent taller), fitting the
// bird's own silhouette at r = 0.974.
//
// Below the line, only OPEN water - away from the reflected bird - flows by its
// own logic. No independent shimmer is laid over the reflection itself.
//
// NON-PERIODICITY: no quantity wraps. Wind events come from a hashed interval
// chain (no fixed lattice), water and light breathe on incommensurable sums
// modulated by slow fBm, and every per-feather cell carries its own rate,
// phase and swell.
// ---------------------------------------------------------------------------
var fsrc = [
"precision highp float;",
"varying vec2 uv;",
"uniform sampler2D tex;",
"uniform sampler2D bgp;",   // plate with the bird lifted out (hidden background)
"uniform sampler2D dep;",   // depth: 0 nearest, 1 far
"uniform float uEye;",
"uniform float uK;",
"uniform float t;",
"uniform float focusY;",
"uniform float baseAmp;",
"uniform float dispScale;",
"uniform float endLife;",
"uniform float prog;",
"uniform float airOn;",
"uniform float openBoost;",   // water + painting are lifted through the opening
// Drivers that vary with time but not with position are computed once per frame on
// the CPU and delivered as uniforms. They are identical for every pixel, so
// recomputing them per pixel bought nothing and cost the frame rate.
"uniform float gDrift;",     // slow wander of the gust baseline
"uniform float wBreath;",    // the open water's breathing
"uniform float bgSwell;",    // the painting's amplitude
"uniform float bgAng;",      // the painting's wandering drift direction
"uniform float tDrift;",     // slow tonal wander
"uniform float pulseV;",     // waterline glint intensity
"uniform vec2  flexLR;",     // per-wing flex swell
"uniform vec2  vortS;",      // the two vortex strengths
"uniform vec4  vortC;",      // the two vortex centres
"",
"const float AXIS  = 0.617;",  // measured waterline / mirror axis
"const float MSCL  = 1.040;",  // measured vertical scale of the reflection
"const float XSCL  = 0.970;",  // measured horizontal scale of the reflection
"",
"float hash(vec2 n){ return fract(sin(dot(n,vec2(12.9898,78.233)))*43758.5453); }",
"float noise(vec2 x){",
"  vec2 i=floor(x); vec2 f=fract(x);",
"  float a=hash(i), b=hash(i+vec2(1.,0.)), c=hash(i+vec2(0.,1.)), d=hash(i+vec2(1.,1.));",
"  vec2 u=f*f*(3.-2.*f);",
"  return mix(mix(a,b,u.x),mix(c,d,u.x),u.y);",
"}",
"float fbm(vec2 x){",
"  float v=0.0, amp=0.5;",
"  for(int i=0;i<5;i++){ v+=amp*noise(x); x*=2.02; amp*=0.5; }",
"  return v;",
"}",
"vec3 cell(vec2 x){",
"  vec2 n=floor(x); vec2 f=fract(x);",
"  float best=9.0; vec2 bestCell=n;",
"  for(int j=-1;j<=1;j++){ for(int i=-1;i<=1;i++){",
"    vec2 g=vec2(float(i),float(j));",
"    vec2 o=vec2(hash(n+g), hash(n+g+17.0));",
"    vec2 d=g+o-f; float dist=dot(d,d);",
"    if(dist<best){ best=dist; bestCell=n+g; }",
"  }}",
"  return vec3(hash(bestCell), hash(bestCell+31.0), best);",
"}",
"",
// the kingfisher reads cool against warm bokeh and warm water
"float birdAt(vec3 c){ return smoothstep(0.10,0.045,c.r-c.b); }",
"",
// ---------------------------------------------------------------------------
// WIND EVENTS - a chain of hashed intervals. Nothing wraps: there is no slot
// grid an eye could learn. Each front has its own gap, side, speed, width and
// strength. Returns x = strength here, y = signed direction of travel.
// ---------------------------------------------------------------------------
"vec2 windAt(float x){",
"  float amt=0.0, dirw=0.0;",
"  float onset=0.0;",
"  for(int i=0;i<18;i++){",
"    float fi=float(i);",
"    float early=1.0-min(fi/6.0,1.0);",                    // denser early, then opening out
"    float gap=mix(4.2,9.5,hash(vec2(fi,91.0)))-early*1.7;",
"    onset+=gap;",
"    float spd=0.115+0.085*hash(vec2(fi,97.0));",
"    float wid=2.7+2.6*hash(vec2(fi,101.0));",
// leave the one deliberate front a clear window either side of it, so the two
// never double up. Suppressing strength, not moving the event, keeps the chain
// monotone and cannot manufacture a collision elsewhere.
"    float str=(0.45+0.65*hash(vec2(fi,103.0)))*smoothstep(3.0,6.5,abs(onset-46.0));",
"    float fromRight=step(0.5,hash(vec2(fi,107.0)));",
"    float x0=mix(-0.28,1.28,fromRight);",
"    float dir=mix(1.0,-1.0,fromRight);",
"    float age=t-onset;",
"    float xc=x0+dir*max(0.0,age)*spd;",
"    float a=step(0.0,age)*exp(-pow((x-xc)*wid,2.0))*str;",
"    amt+=a; dirw+=a*dir;",
"  }",
// the one deliberate event: a wide front entering from the right at the midpoint
"  float mx=1.26-max(0.0,t-46.0)*0.155;",
"  float mid=step(46.0,t)*exp(-pow((x-mx)*2.9,2.0));",
"  amt+=mid; dirw-=mid;",
"  return vec2(min(amt,1.6), dirw);",
"}",
"",
// ---------------------------------------------------------------------------
// AIR MOTION IN BIRD-SPACE. One function. The bird uses it at p; the reflection
// uses it at the mirrored point and flips the result. Everything the air does
// is inside here, so nothing can happen above without happening below.
// ---------------------------------------------------------------------------
// wind is passed in, computed once per pixel in main: the mirror shares the same x,
// so the bird and its reflection are inside the identical front by construction.
"vec2 airMotion(vec2 q, vec2 wind){",
"  vec3 base=texture2D(tex,q).rgb;",
"  float bird=birdAt(base);",
"  if(bird<0.02) return vec2(0.0);",   // off the bird: no air work, no texture fetches
"  float ab=1.0-smoothstep(AXIS-0.008,AXIS+0.006,q.y);",
"  float airBird=bird*ab;",
"",
// stillness radiates from the contact point; the beak column is the anchor
"  float dC=distance(q*vec2(1.0,1.34), vec2(0.502,AXIS)*vec2(1.0,1.34));",
"  float calmq=smoothstep(0.018,0.095,dC);",
"  float beakCol=smoothstep(0.05,0.02,abs(q.x-0.502))*smoothstep(0.44,0.50,q.y)*ab;",
"  float still=calmq*(1.0-beakCol*0.95);",
"",
"  float focus=exp(-pow((q.y-focusY)*3.0,2.0));",
"  float sweep=wind.x;",
"",
"  float side=sign(q.x-0.502);",
"  vec2 lay=normalize(vec2(side,-1.05));",
"  vec2 across=vec2(lay.y,-lay.x);",
"  float u=dot(q,lay), v=dot(q,across);",
"",
// gust: incommensurable sines, slow fBm wander, spatial front, plus the sweeps
"  float gA = 0.38*sin(t*6.2831/7.1)",
"           + 0.29*sin(t*6.2831/11.9 + 1.7)",
"           + 0.21*sin(t*6.2831/19.3 + 3.1)",
"           + 0.16*sin(t*6.2831/4.7  + 0.9);",
"  float gustSpace=fbm(vec2(q.x*2.3 + t*0.11, q.y*2.1 - t*0.07))-0.5;",
"  float gust=clamp(0.62 + 0.34*gA + 0.55*gDrift + 0.42*gustSpace, 0.15, 1.30);",
"  gust*=(1.0+sweep*0.9);",
"",
// per-feather cells: own phase, own rate, own swell that rises and dissolves
"  vec3 fc=cell(vec2(u*26.0, v*32.0));",
"  float cellSwell=0.30+0.70*fbm(vec2(t*0.13+fc.x*7.0, fc.y*9.0));",
"  float cellFlutter=sin(t*6.2831/mix(4.6,9.7,fc.y)+fc.x*6.2831)*cellSwell;",
"  float edge=smoothstep(0.0,0.12,fc.z);",
"  float perFeather=cellFlutter*(0.45+0.55*edge);",
"  float ruffle=(fbm(vec2(u*7.0 - t*1.1, v*36.0))*0.5",
"               +fbm(vec2(u*10.0 + t*1.5, v*50.0))*0.5)-0.5;",
"  float amp=(baseAmp*0.78 + focus*0.50)*gust;",
"",
// the pale back stripe is smooth plumage: flutters, only softened
"  float backStripe=smoothstep(0.04,0.10,base.b-base.r)",
"                  *smoothstep(0.42,0.58,dot(base,vec3(0.299,0.587,0.114)))*ab;",
"  float flutterZone=airBird*(1.0-backStripe*0.25);",
"  vec2 shear=across*(perFeather*0.0170 + ruffle*0.0062) + lay*(ruffle*0.0055);",
"  vec2 disp=shear*amp*flutterZone*still;",
"  disp+=vec2(sin(t*6.2831/16.4+0.4), sin(t*6.2831/23.7+1.9))",
"        *0.0035*(0.5+0.5*fbm(vec2(t*0.1,3.7)))*backStripe*airBird*still;",
"",
// wing flex: the broad interior of each swept wing breathes on its own timing
"  float coreL=exp(-(pow((q.x-0.345)*6.5,2.0)+pow((q.y-0.295)*8.0,2.0)));",
"  float coreR=exp(-(pow((q.x-0.635)*6.5,2.0)+pow((q.y-0.285)*8.0,2.0)));",
"  float flexL=(0.6*sin(t*6.2831/12.7)+0.4*sin(t*6.2831/20.9+1.3))*flexLR.x;",
"  float flexR=(0.6*sin(t*6.2831/15.1+0.7)+0.4*sin(t*6.2831/24.7+2.1))*flexLR.y;",
"  disp+=vec2(flexL*0.011, flexL*0.006)*coreL*airBird*still*(1.0+sweep*0.6);",
"  disp+=vec2(-flexR*0.011,flexR*0.006)*coreR*airBird*still*(1.0+sweep*0.6);",
"",
// crown: the top of the head has its own fine cross-ripple
"  float crown=smoothstep(0.115,0.075,abs(q.x-0.502))",
"             *smoothstep(0.135,0.175,q.y)*smoothstep(0.315,0.245,q.y)*airBird;",
"  vec3 fch=cell(vec2(q.x*30.0, q.y*36.0));",
"  float hSwell=0.35+0.65*fbm(vec2(t*0.11+fch.x*5.0, fch.y*8.0+201.0));",
"  float hFlut=sin(t*6.2831/mix(5.3,10.3,fch.y)+fch.x*6.2831)*hSwell;",
"  disp+=(vec2(0.9,0.35)*hFlut*0.0095 + across*ruffle*0.004)*crown*gust;",
"",
// the front itself: a directional push with a transverse wobble riding it
"  disp+=vec2(0.009*wind.y,",
"             (fbm(vec2(q.x*8.0 - t*1.4, q.y*6.0))-0.5)*0.022*sweep)*still*airBird;",

// ONE edge guard for the whole air displacement: if it would pull the silhouette
// out into the bokeh, fade it. One texture fetch instead of four.

"}",
"",
"void main(){",
// ---------- STEREO: each eye finds the point it sees, then the whole piece runs there ----------
"  float hK=uK*0.5;",
"  vec2 sv=vec2(0.5)+(uv-vec2(0.5))*(1.0-2.0*(hK+0.003));",
"  float eK=uEye*hK;",
"  float tP=0.0, dP=texture2D(dep,sv).r, fP=dP, tS=1.0; bool hit=false;",
// a crossing only counts on a continuous surface; across an edge the hidden background is used
"  for(int i=1;i<=40;i++){",
"    float tt=float(i)/40.0;",
"    float d=texture2D(dep,vec2(sv.x-eK*tt,sv.y)).r;",
"    float f=d-tt;",
"    if(!hit && f<=0.0 && abs(d-dP)<0.12){ tS=mix(tP,tt,fP/(fP-f+1e-5)); hit=true; }",
"    tP=tt; fP=f; dP=d;",
"  }",
"  float useBg=hit?0.0:1.0;",
"  vec2 p=vec2(sv.x-eK*tS,sv.y);",
"  float below=smoothstep(AXIS-0.006,AXIS+0.010,p.y);",
"  float above=1.0-below;",
"  vec3 base=texture2D(tex,p).rgb;",
"  float bird=birdAt(base);",
"  float reflBird=bird*below;",
"  float openWater=below*(1.0-bird);",
"  float bgAir=above*(1.0-bird);",
"  float surfBand=exp(-pow((p.y-AXIS)*70.0,2.0));",
"  float dC=distance(p*vec2(1.0,1.34), vec2(0.502,AXIS)*vec2(1.0,1.34));",
"  float calm=smoothstep(0.018,0.095,dC);",
"",
// ---------- THE MIRROR ----------
// above: the air acts directly. below: the SAME air event, read at the mirrored
// point and inverted, scaled by the measured 1.050 stretch of the reflection.
"  vec2 wind=windAt(p.x);",
"  vec2 airDisp=vec2(0.0), mirrorDisp=vec2(0.0);",
"  if(bird>0.02){",
"    if(above>0.01){ airDisp=airMotion(p,wind)*above; }",
"    if(below>0.01){",
// the measured mirror map: the reflection stands 1.040 taller and 0.970 narrower
"      vec2 dm=airMotion(vec2(0.502+(p.x-0.502)/XSCL, AXIS-(p.y-AXIS)/MSCL), wind);",
"      mirrorDisp=vec2(dm.x*XSCL, -dm.y*MSCL)*reflBird;",
"    }",
"  }",
"",
// ---------- OPEN WATER ONLY ----------
// no independent shimmer is laid over the reflected bird; the mirror is the mirror.
"  float flow=t*0.21;",
"  vec2 wq=vec2(p.x*3.2,p.y*4.2);",
"  float w1=fbm(wq+vec2(flow*0.45,flow*0.9));",
"  float w2=fbm(wq*1.9+vec2(-flow*0.6,flow*0.4)+w1*1.8);",
"  float w3=fbm(wq*3.4+vec2(flow*0.3,-flow*0.55)+w2*1.1);",
"  vec2 wd=vec2((w2-0.5)*0.050+(w3-0.5)*0.018,(w1-0.5)*0.058+(w3-0.5)*0.020);",
"  float swellY=sin(p.x*4.0 + t*0.5)*sin(p.y*5.0 - t*0.4);",
"  wd.y+=swellY*0.012*(0.5+0.5*fbm(vec2(t*0.08,91.0)));",
"  wd*=wBreath*(1.0+wind.x*0.35)*openBoost;",
"  vec2 waterDisp=wd*openWater*(1.0-surfBand*0.92)*calm;",
// the passing front also pushes the open water
"  waterDisp+=vec2(0.007*wind.y,(fbm(vec2(p.x*8.0-t*1.4,p.y*6.0))-0.5)*0.016*wind.x)",
"             *openWater*calm*(1.0-surfBand*0.6);",
"",
// ---------- THE PAINTING ----------
"  vec2 bgDir=vec2(cos(bgAng),sin(bgAng));",
"  float ec=0.035;",
"  vec2 cq=vec2(p.x*2.2,p.y*2.2)+bgDir*t*0.045;",
"  vec2 curl=vec2( fbm(cq+vec2(0.0,ec))-fbm(cq-vec2(0.0,ec)),",
"                 -(fbm(cq+vec2(ec,0.0))-fbm(cq-vec2(ec,0.0))) )/(2.0*ec);",
"  vec2 r1=p-vortC.xy, r2=p-vortC.zw;",
"  vec2 vort=vec2(-r1.y,r1.x)*vortS.x*exp(-dot(r1,r1)*9.0)",
"           +vec2(-r2.y,r2.x)*vortS.y*exp(-dot(r2,r2)*9.0);",
"  float b1=fbm(vec2(p.x*1.6,p.y*1.6)+bgDir*t*0.055);",
"  float b2=fbm(vec2(p.x*3.1+37.0,p.y*3.1)-bgDir.yx*t*0.038+b1*0.9);",
"  vec2 bgDisp=(curl*0.0075 + vort*0.060 + vec2(b1-0.5,(b2-0.5)*0.8)*0.009)",
"              *bgSwell*(1.0+wind.x*0.5)*openBoost*bgAir;",
"",
"  float lowScale=max(dispScale,endLife);",
"  vec2 fading=(airDisp+mirrorDisp+bgDisp)*dispScale;",
"  vec2 living=waterDisp*lowScale;",
"  vec3 col=mix(texture2D(tex, p+fading+living).rgb, texture2D(bgp, p+fading+living).rgb, useBg);",
"",
// ---------- WATERLINE GLINTS - aperiodic, no slot grid ----------
"  float gl1=fbm(vec2(p.x*22.0-flow*1.5, p.y*60.0));",
"  float glint=pow(max(gl1,0.0),3.0)*exp(-pow((p.y-AXIS)*38.0,2.0))*(1.0-bird);",
"  col+=vec3(0.16,0.13,0.08)*glint*(0.25+0.85*pulseV)*dispScale;",
"",
// the painting's light is alive too
"  float bgGlow=fbm(vec2(p.x*2.4 - t*0.030, p.y*2.4 + t*0.024));",
"  col*=1.0 + (bgGlow-0.5)*0.10*bgAir*bgSwell*openBoost*dispScale;",
"",
"  float pc1=sin(t*6.2831/22.6), pc2=sin(t*6.2831/34.1+1.3), pc3=sin(t*6.2831/41.7+2.6);",
"  col*=(1.0+(pc1*0.4+pc2*0.3+pc3*0.2+tDrift*0.6)*0.035*dispScale);",
"  float warmc=pc2*0.5+0.5;",
"  col*=mix(vec3(1.0), vec3(1.0+0.025*warmc,1.0,1.0-0.02*warmc), 0.5*dispScale);",
"  col=min(col,vec3(0.985));",
"",
"  float vig=smoothstep(1.15,0.35,length(uv-0.5));",
"  col*=mix(0.86,1.0,vig);",
"  gl_FragColor=vec4(col,1.0);",
"}"

function compile(type,src){

  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
  return s;
}

// CPU-side value noise, matching the shader's character. These drivers depend on
// the clock alone, so one evaluation per frame replaces one per pixel.
function jhash(x,y){ var v=Math.sin(x*12.9898+y*78.233)*43758.5453; return v-Math.floor(v); }
function jnoise(x,y){
  var ix=Math.floor(x), iy=Math.floor(y), fx=x-ix, fy=y-iy;
  var a=jhash(ix,iy), b=jhash(ix+1,iy), c=jhash(ix,iy+1), d=jhash(ix+1,iy+1);
  var ux=fx*fx*(3-2*fx), uy=fy*fy*(3-2*fy);
  return (a+(b-a)*ux)+((c+(d-c)*ux)-(a+(b-a)*ux))*uy;
}
function jfbm(x,y){
  var v=0, amp=0.5;
  for(var i=0;i<5;i++){ v+=amp*jnoise(x,y); x*=2.02; y*=2.02; amp*=0.5; }
  return v;
}

// RENDER SCALE: the piece is displacement-heavy, and a machine that cannot hold the
// frame rate produces stepping rather than flow. The buffer is quietly scaled to
// whatever the machine can sustain; the displayed size never changes.
var renderScale=1.0;
/* STEREO VIEW: two halves for the OWL viewer. SEP = centre-to-centre in CSS px
   (383 px = 63.5 mm on an iPhone 17, the Islands in Infinity spacing). K = disparity, fraction of width. */
var SEP=383, K=0.061, EYEW=0, SEPD=0;
function resize(){
  var vw=(window.visualViewport && window.visualViewport.width)  || window.innerWidth;
  var vh=(window.visualViewport && window.visualViewport.height) || window.innerHeight;
  var AR=IMG_W/IMG_H;
  var hw=Math.min(SEP-6, (vh-2)*0.97*AR, vw-SEP); if(hw<60) hw=60;
  var hh=Math.floor(hw/AR), Wd=Math.floor(SEP+hw);
  document.documentElement.style.setProperty('--fitw', Wd+'px');
  document.documentElement.style.setProperty('--fith', hh+'px');
  var dpr=Math.min(window.devicePixelRatio||1,2)*renderScale;
  canvas.width=Math.max(2,Math.floor(Wd*dpr));
  canvas.height=Math.max(2,Math.floor(hh*dpr));
  canvas.style.width=Wd+'px'; canvas.style.height=hh+'px';
  EYEW=Math.floor(hw*dpr); SEPD=Math.floor(SEP*dpr);
}
window.addEventListener('resize',resize);
if(window.visualViewport){ window.visualViewport.addEventListener('resize',resize); }
window.addEventListener('orientationchange',function(){ setTimeout(resize,300); });
resize();

function sstep(a,b,x){ x=Math.max(0,Math.min(1,(x-a)/(b-a))); return x*x*(3-2*x); }

var startTime=null, running=false;
var lastNow=0, ftSum=0, ftN=0;
function frame(now){
  if(!running) return;
  if(startTime===null){ startTime=now; lastNow=now; }
  // watch the real frame time and give back resolution before the eye sees stepping
  var ft=now-lastNow; lastNow=now;
  if(ft>0 && ft<400){ ftSum+=ft; ftN++; }
  if(ftN>=40){
    var avg=ftSum/ftN; ftSum=0; ftN=0;
    if(avg>21.0 && renderScale>0.62){ renderScale=Math.max(0.62,renderScale-0.16); resize(); }
    else if(avg<12.5 && renderScale<1.0){ renderScale=Math.min(1.0,renderScale+0.10); resize(); }
  }
  var t=((now-startTime)/1000.0)%DURATION;   /* continuous loop */
  var dispScale=1.0;

  if(t>=DURATION){ showAgain(); return; }
  var pr=t/DURATION;

  // FOCUS travels in BIRD-SPACE, so the reflection carries the identical travelling
  // emphasis inverted at the same instant. It begins at the body just above the
  // beak - the held instant - dwells, then rises through the wings to the crown.
  var focusY;
  if(pr<0.14){ focusY=0.505 + (0.480-0.505)*sstep(0.0,0.14,pr); }
  else if(pr<0.42){ focusY=0.480 + (0.395-0.480)*sstep(0.14,0.42,pr); }
  else if(pr<0.74){ focusY=0.395 + (0.265-0.395)*sstep(0.42,0.74,pr); }
  else { focusY=0.265 + (0.155-0.265)*sstep(0.74,1.0,pr); }

  // BASE AMP: incommensurable swells plus a wandering term whose own phase drifts
  var sw = 0.09*Math.sin(t*6.2831/18.3)
         + 0.075*Math.sin(t*6.2831/29.7 + 1.2)
         + 0.06*Math.sin(t*6.2831/45.1 + 2.4)
         + 0.05*Math.sin(t*6.2831/11.7 + 0.6);
  var wander = 0.06*Math.sin(t*6.2831/61.3 + Math.sin(t*6.2831/97.1)*1.7);
  var baseAmp=Math.max(0.28,Math.min(0.80,0.45+sw+wander));
  var midDip=Math.exp(-Math.pow((pr-0.5)/0.30,2.0));
  baseAmp*=(0.74-0.10*midDip);
  baseAmp*=1.0+0.55*(1.0-sstep(8.0,30.0,t));

  var endLife=Math.min(1.0,Math.max(0.0,(t-(DURATION-12.0))/12.0));
  endLife=endLife*endLife*(3-2*endLife);

  // OPENING: the whole field wakes together. The water and painting are lifted
  // only slightly and settle back, so nothing below starts on its own impetus.
  var ob=1.0+0.30*(1.0-sstep(1.0,18.0,t));
  ob*=1.0+0.07*Math.sin(t*6.2831/9.3)+0.05*Math.sin(t*6.2831/14.9+1.1);

  gl.uniform1f(uT,t);
  gl.uniform1f(uFocusY,focusY);
  gl.uniform1f(uBaseAmp,baseAmp);
  gl.uniform1f(uDisp,dispScale);
  gl.uniform1f(uEndLife,endLife);
  gl.uniform1f(uProg,Math.min(1.0,pr));
  gl.uniform1f(uAirOn,sstep(0.5,3.5,t));
  gl.uniform1f(uOpenBoost,ob);

  // the per-frame drivers
  gl.uniform1f(uGDrift, jfbm(t*0.055,23.0)-0.5);
  var wb=0.72 + 0.18*Math.sin(t*6.2831/13.7) + 0.13*Math.sin(t*6.2831/23.9+2.2)
         + (jfbm(t*0.07,51.0)-0.5)*0.55;
  gl.uniform1f(uWBreath, Math.max(0.30,Math.min(1.20,wb)));
  var bs=0.55 + 0.25*Math.sin(t*6.2831/26.9) + 0.20*Math.sin(t*6.2831/40.3+2.1)
         + (jfbm(t*0.06,151.0)-0.5)*0.9;
  gl.uniform1f(uBgSwell, Math.max(0.10,Math.min(1.10,bs)));
  gl.uniform1f(uBgAng, 6.2831*jfbm(t*0.020,131.0));
  gl.uniform1f(uTDrift, jfbm(t*0.045,5.0)-0.5);
  var pv=(jfbm(t*0.37,17.0)-0.52)/0.34; pv=Math.max(0,Math.min(1,pv)); pv=pv*pv*(3-2*pv);
  gl.uniform1f(uPulseV, pv);
  gl.uniform2f(uFlexLR, 0.4+0.6*jfbm(t*0.09,41.0), 0.4+0.6*jfbm(t*0.09,61.0));
  gl.uniform2f(uVortS, (jfbm(t*0.050,341.0)-0.5)*2.2, (jfbm(t*0.045,351.0)-0.5)*-2.0);
  gl.uniform4f(uVortC, 0.24+(jfbm(t*0.017,301.0)-0.5)*0.22, 0.30+(jfbm(t*0.014,311.0)-0.5)*0.22,
                       0.78+(jfbm(t*0.015,321.0)-0.5)*0.22, 0.42+(jfbm(t*0.019,331.0)-0.5)*0.22);

  try{
    var a0=document.getElementById('stemA');
    if(a0 && a0.src){ a0.volume=1.0; }
    var endFade=1.0; if(t>DURATION-6.0){ endFade=Math.max(0.0,(DURATION-t)/6.0); }
    ['stemB','stemC','stemD'].forEach(function(id){
      var a=document.getElementById(id);
      if(a && a.src){ a.volume=0.8*endFade; }
    });
  }catch(e){}
  gl.uniform1f(uK,K);
  gl.viewport(0,0,canvas.width,canvas.height);
  gl.clearColor(0,0,0,1); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.viewport(0,0,EYEW,canvas.height);    gl.uniform1f(uEye,-1.0); gl.drawArrays(gl.TRIANGLES,0,6);
  gl.viewport(SEPD,0,EYEW,canvas.height); gl.uniform1f(uEye, 1.0); gl.drawArrays(gl.TRIANGLES,0,6);
  requestAnimationFrame(frame);
}

var enter=document.getElementById('enter');
var again=document.getElementById('again');
document.addEventListener('keydown',function(e){
  if(e.key==='3'){ running=false;
    if(enter) enter.classList.add('gone');
    try{ ['stemA','stemB','stemC','stemD'].forEach(function(id){ var a=document.getElementById(id); if(a){ a.pause(); } }); }catch(err){}
    if(again) again.classList.add('show');
  }
});
function begin(){
  enter.classList.add('gone'); document.body.classList.add('running');
  again.classList.remove('show');
  startTime=null; running=true; lastNow=0; ftSum=0; ftN=0;
  try{
    ['stemA','stemB','stemC','stemD'].forEach(function(id){
      var a=document.getElementById(id);
      var s=document.getElementById(id+'src');
      if(a && s && s.textContent.trim().length>32){
        if(!a.src){ a.src=s.textContent.trim(); }
        a.currentTime=0; a.volume=(id==='stemA')?1.0:0.0; a.play();
      }
    });
  }catch(e){}
  requestAnimationFrame(frame);
}
function showAgain(){
  running=false;
  setTimeout(function(){ again.classList.add('show'); },2000);
  try{
    ['stemA','stemB','stemC','stemD'].forEach(function(id){
      var a=document.getElementById(id);
      if(a && a.src){
        var v0=a.volume, k=0, steps=40;
        var f=setInterval(function(){ k++; var f2=1-k/steps; a.volume=Math.max(0,v0*f2*f2);
          if(k>=steps){ clearInterval(f); try{a.pause();}catch(e){} } },50);
      }
    });
  }catch(e){}
}
enter.addEventListener('click',begin);
(function(){
  var b=document.getElementById('dlbox');
  b.addEventListener('click',function(ev){ ev.stopPropagation();
    try{ var html='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
      var url=URL.createObjectURL(new Blob([html],{type:'text/html'}));
      var a=document.createElement('a'); a.href=url; a.download='Kingfisher_Stereo_View_v1.html';
      document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); },1500);
    }catch(e){}
    if(b.parentNode) b.parentNode.removeChild(b); });
  var panel=document.getElementById('panel');
  var sK=document.getElementById('sK'), sS=document.getElementById('sS');
  var vK=document.getElementById('vK'), vS=document.getElementById('vS');
  sK.value=K; sS.value=SEP;
  function upd(){ K=parseFloat(sK.value); SEP=parseFloat(sS.value);
    vK.textContent=K.toFixed(3); vS.textContent=SEP+'px'; resize(); }
  sK.addEventListener('input',upd); sS.addEventListener('input',upd); upd();
  document.getElementById('adjbtn').addEventListener('click',function(e){ e.stopPropagation();
    panel.style.display=(panel.style.display==='block')?'none':'block'; });
  panel.addEventListener('click',function(e){ e.stopPropagation(); });
  document.getElementById('pclose').addEventListener('click',function(e){ e.stopPropagation(); panel.style.display='none'; });
  document.getElementById('stage').addEventListener('click',function(){ panel.style.display='none'; });
})();
again.addEventListener('click',begin);
</script>
